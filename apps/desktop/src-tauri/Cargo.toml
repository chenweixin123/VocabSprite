[package]
name = "vocabsprite-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VocabSprite offline-first desktop application"
build = "build.rs"

[lib]
name = "vocabsprite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow.workspace = true
arboard = { version = "3.6", default-features = false }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2.3"
uuid.workspace = true
vocabsprite-learning-core = { path = "../../../crates/learning-core" }
vocabsprite-platform = { path = "../../../crates/platform" }
vocabsprite-storage = { path = "../../../crates/storage" }
