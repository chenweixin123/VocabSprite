[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/learning-core",
  "crates/pack-engine",
  "crates/storage",
  "crates/platform",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
